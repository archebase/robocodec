[package]
name = "robocodec"
version = "0.1.0"
edition = "2024"
authors = ["Strata Contributors"]
license = "MulanPSL-2.0"
description = "High-performance robotics data codec library for reading, writing, and converting MCAP and ROS1 bag files with support for CDR, Protobuf, and JSON encodings"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "robocodec"
path = "src/bin/robocodec.rs"
required-features = ["cli"]

[[example]]
name = "upload-fixtures"
path = "scripts/upload-fixtures.rs"

[[bin]]
name = "generate_rrd_fixtures"
path = "tests/generate_rrd_fixtures.rs"

[[bin]]
name = "generate_rrf2_fixtures"
path = "tests/generate_rrf2_fixtures.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
pest = "2.7"
pest_derive = "2.7"
byteorder = "1.5"
memmap2 = "0.9"
prost = "0.13"
prost-types = "0.13"
prost-reflect = "0.14"
hex = "0.4"
toml = "0.8"
regex = "1.10"
rayon = "1.10"
crossbeam-channel = "0.5"
crossbeam = "0.8"
crossbeam-queue = "0.3"
libc = "0.2"
num_cpus = "1.16"
zstd = "0.13"
lz4_flex = "0.11"
bzip2 = "0.4"
crc32fast = "1.4"
mcap = "0.24"
rosbag = "0.6"
bumpalo = "3.16"
bytemuck = "1.15"
chrono = "0.4"
tracing = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
tikv-jemallocator = { version = "0.6", optional = true }
pyo3 = { version = "0.25", features = ["abi3-py311", "extension-module"], optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
indicatif = { version = "0.17", optional = true }
human-size = { version = "0.4", optional = true }
# S3 streaming support (gated behind s3 feature)
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false, optional = true }
bytes = { version = "1.6", optional = true }
tokio = { version = "1.40", features = ["rt-multi-thread", "time"], default-features = false, optional = true }
http = { version = "1.1", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }
url = { version = "2.5", optional = true }
once_cell = { version = "1.19", optional = true }
# AWS SDK for S3 (already gated)
aws-config = { version = "1.5", features = ["behavior-version-latest"], default-features = false, optional = true }
aws-credential-types = { version = "1.2", default-features = false, optional = true }
percent-encoding = { version = "2.3.2", optional = true }

[features]
default = ["s3"]
python = ["pyo3"]
jemalloc = ["dep:tikv-jemallocator"]
cli = ["clap", "indicatif", "human-size"]
s3 = [
    "aws-config",
    "aws-credential-types",
    "reqwest",
    "bytes",
    "tokio",
    "http",
    "hmac",
    "sha2",
    "async-trait",
    "futures",
    "url",
    "once_cell",
    "percent-encoding",
]

[dev-dependencies]
proptest = "1.4"
wiremock = "0.6"
tokio-test = "0.4"
tempfile = "3.10"
