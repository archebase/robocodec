# S3 Integration Test Workflow
#
# This workflow uses docker-compose to set up MinIO, matching the local
# development setup. This ensures "local pass means CI pass".

name: S3 Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - 'src/io/s3/**'
      - 'tests/s3_integration_test.rs'
      - 'tests/s3_tests.rs'
      - 'docker-compose.yml'
      - '.github/workflows/test-s3.yml'
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  MINIO_ENDPOINT: http://localhost:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: test-fixtures
  MINIO_REGION: us-east-1

jobs:
  s3-integration-tests:
    name: S3 Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-s3-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-s3-

      - name: Build robocodec
        run: cargo build --release

      - name: Start MinIO with docker-compose
        run: docker compose up -d minio minio-init

      - name: Wait for MinIO to be ready
        run: |
          # Wait for MinIO health endpoint
          for i in {1..30}; do
            if curl -f http://localhost:9000/minio/health/live 2>/dev/null; then
              echo "MinIO is ready"
              break
            fi
            echo "Waiting for MinIO... ($i/30)"
            sleep 2
          done

          # Verify bucket was created by minio-init
          if ! curl -f http://localhost:9000/test-fixtures 2>/dev/null; then
            echo "Bucket 'test-fixtures' not found"
            docker compose logs minio-init
            exit 1
          fi
          echo "Bucket 'test-fixtures' is ready"

      - name: Run S3 integration tests
        run: cargo test --test s3_integration

      - name: Run S3 unit tests
        run: cargo test --package robocodec --lib io::s3

      - name: Run S3 integration tests (live)
        run: cargo test --package robocodec --lib s3_integration_tests

      - name: Run clippy on S3 module
        run: cargo clippy --package robocodec -- -D warnings -D clippy::all
        if: always()

      - name: Format check
        run: cargo fmt --package robocodec -- --check
        if: always()

      - name: Cleanup docker-compose
        if: always()
        run: docker compose down -v
