name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  license:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install reuse tool
        run: pip install reuse

      - name: Check REUSE compliance
        run: reuse lint

  rust-lint:
    name: Rust Lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run fmt check
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  rust-test:
    name: Rust Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Note: Do NOT use --all-features or --features python here.
      # PyO3's extension-module feature prevents linking in standalone test binaries.
      # Python bindings would be tested separately via maturin if needed.
      - name: Build CLI binary (for CLI tests)
        run: cargo build --bin robocodec --package robocodec-cli

      - name: Run tests
        run: cargo test

  rust-test-coverage:
    name: Rust Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Cache cargo-llvm-cov
        uses: actions/cache@v4
        id: cache-llvm-cov
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: ${{ runner.os }}-cargo-llvm-cov-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-llvm-cov
        if: steps.cache-llvm-cov.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov

      # Note: Do NOT use --all-features or --features python here.
      # PyO3's extension-module feature prevents linking in standalone test binaries.
      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --features remote --lcov --output-path lcov-rust.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./lcov-rust.info
          flags: rust
          name: rust-coverage
          fail_ci_if_error: false
          verbose: true

  rust-test-windows:
    name: Rust Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI binary (for CLI tests)
        run: cargo build --bin robocodec --package robocodec-cli

      - name: Run tests
        run: cargo test

  python-test:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Create virtual environment (Unix)
        if: runner.os != 'macOS'
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Create virtual environment (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install maturin and pytest
        run: pip install maturin[patchelf] pytest pytest-cov

      - name: Build and install Python package
        run: maturin develop --release --features python

      - name: Run Python tests with coverage
        run: pytest tests/python/ --cov=robocodec --cov-report=xml --cov-report=term-missing -v

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: python
          name: python-coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: true

  python-examples:
    name: Python Examples (API Compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install maturin
        run: pip install maturin[patchelf]

      - name: Build and install Python package
        run: maturin develop --features python

      - name: Test Python examples for API compatibility
        run: make test-examples

  s3-test:
    name: S3 Streaming Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Start MinIO container
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest \
            server /data --console-address ":9001"

      - name: Wait for MinIO to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://127.0.0.1:9000/minio/health/live; do sleep 1; done'

      - name: Install MinIO client
        run: |
          wget -q https://dl.min.io/client/mc/release/linux-amd64/mc -O /tmp/mc
          chmod +x /tmp/mc

      - name: Configure MinIO alias and create bucket
        run: |
          /tmp/mc alias set robocodec-test http://127.0.0.1:9000 minioadmin minioadmin
          /tmp/mc mb robocodec-test/test-bucket --ignore-existing

      - name: Upload MCAP fixture to MinIO
        run: |
          /tmp/mc cp tests/fixtures/robocodec_test_0.mcap robocodec-test/test-bucket/test/robocodec_test_0.mcap

      - name: Upload BAG fixture to MinIO
        run: |
          /tmp/mc cp tests/fixtures/robocodec_test_15.bag robocodec-test/test-bucket/test/robocodec_test_15.bag

      - name: Run S3 tests
        env:
          MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_BUCKET: test-bucket
          MINIO_REGION: us-east-1
          ROBOCODEC_REQUIRE_S3: "1"
        run: cargo test --features remote -- s3_integration_tests
