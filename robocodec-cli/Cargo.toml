[package]
name = "robocodec-cli"
version = "0.1.0"
edition = "2024"
authors = ["Strata Contributors"]
license = "MulanPSL-2.0"
description = "Command-line interface for robocodec robotics data codec library"

[[bin]]
name = "robocodec"
path = "src/main.rs"

[dependencies]
robocodec = { path = "..", default-features = false, features = ["remote"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
human-size = "0.4"
chrono = "0.4"
serde = "1.0"
serde_json = "1.0"
