# Docker Compose configuration for robocodec S3 testing.
#
# This file sets up MinIO for S3-compatible object storage testing.
#
# Usage:
#   docker compose up -d          # Start MinIO
#   docker compose down           # Stop MinIO
#   docker compose down -v        # Stop and remove volumes
#   docker compose logs -f minio  # View MinIO logs

services:
  # MinIO for S3-compatible object storage
  minio:
    image: minio/minio:latest
    container_name: robocodec-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MinIO client to create buckets and upload test fixtures
  minio-init:
    image: minio/mc:latest
    container_name: robocodec-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set robocodec http://minio:9000 minioadmin minioadmin;
        mc mb robocodec/test-fixtures --ignore-existing;
        mc anonymous set download robocodec/test-fixtures;
        exit 0;
      "

volumes:
  minio_data:
